<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Leader Engineering Services</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/png" href="Logo%20d%E2%80%99ing%C3%A9nierie%20et%20construction%20en%20bleu%20et%20jaune.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ===== Leader Engineering Services — design moderne ===== */
:root{
  --bg:#F4F6FB; --surface:#FFFFFF; --surface2:#EEF2F8; --ink:#0B1220; --muted:#667085; --line:#E4E9F1;
  --brand:#4F46E5; --brand-2:#7C3AED; --brand-ink:#FFFFFF; --brand-soft:#EEF0FF;
  --hero-bg:linear-gradient(135deg,#312E81 0%,#4F46E5 68%,#6D28D9 100%); --hero-ink:#F8FAFC;
  --amber:#F59E0B; --amber-soft:#FEF3C7; --amber-ink:#92400E;
  --ok:#10B981; --ok-soft:#D1FAE5; --crit:#EF4444; --crit-soft:#FEE2E2;
  --p-macon:#4F46E5; --p-coffreur:#0EA5E9; --p-ferrailleur:#D97706; --p-mo:#64748B;
  --shadow:0 1px 2px rgba(11,18,32,.05), 0 12px 32px -18px rgba(11,18,32,.22);
  --shadow-lg:0 28px 70px -28px rgba(11,18,32,.45);
  --r:16px; --r-sm:10px;
  --f-display:'Space Grotesk','Arial Narrow',sans-serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0F1C; --surface:#121A2B; --surface2:#1A2438; --ink:#E8EDF7; --muted:#94A3B8; --line:#24304A;
    --brand:#818CF8; --brand-2:#A78BFA; --brand-ink:#0B1020; --brand-soft:#232A4A;
    --hero-bg:linear-gradient(135deg,#1E1B4B 0%,#3730A3 68%,#5B21B6 100%); --hero-ink:#F8FAFC;
    --amber:#FBBF24; --amber-soft:#3A2E10; --amber-ink:#FCD34D;
    --ok:#34D399; --ok-soft:#0C3B2C; --crit:#F87171; --crit-soft:#3C1A1A;
    --p-macon:#818CF8; --p-coffreur:#38BDF8; --p-ferrailleur:#FBBF24; --p-mo:#94A3B8;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 36px -18px rgba(0,0,0,.7);
    --shadow-lg:0 30px 80px -30px rgba(0,0,0,.85);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0F1C; --surface:#121A2B; --surface2:#1A2438; --ink:#E8EDF7; --muted:#94A3B8; --line:#24304A;
  --brand:#818CF8; --brand-2:#A78BFA; --brand-ink:#0B1020; --brand-soft:#232A4A;
  --hero-bg:linear-gradient(135deg,#1E1B4B 0%,#3730A3 68%,#5B21B6 100%); --hero-ink:#F8FAFC;
  --amber:#FBBF24; --amber-soft:#3A2E10; --amber-ink:#FCD34D;
  --ok:#34D399; --ok-soft:#0C3B2C; --crit:#F87171; --crit-soft:#3C1A1A;
  --p-macon:#818CF8; --p-coffreur:#38BDF8; --p-ferrailleur:#FBBF24; --p-mo:#94A3B8;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 36px -18px rgba(0,0,0,.7);
  --shadow-lg:0 30px 80px -30px rgba(0,0,0,.85);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 var(--f-body); font-weight:500;
  -webkit-font-smoothing:antialiased;
  padding-block:0; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
h1,h2,h3{font-family:var(--f-display); font-weight:700; margin:0; text-wrap:balance; letter-spacing:-.01em}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand); outline-offset:2px; border-radius:6px}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.lbl{font-size:11.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:700}

/* boutons */
.btn{display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--surface); border-radius:var(--r-sm); padding:8px 14px; font-weight:700; font-size:14px; min-height:38px; transition:background .15s,border-color .15s,transform .15s,box-shadow .15s}
.btn:hover{background:var(--surface2)}
.btn.pri{background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:var(--brand-ink); border-color:transparent; box-shadow:0 6px 18px -8px color-mix(in srgb,var(--brand) 70%,transparent)}
.btn.pri:hover{transform:translateY(-1px); filter:brightness(1.06)}
.btn.warn{background:var(--crit); border-color:var(--crit); color:#fff}
.btn.sm{padding:5px 10px; min-height:30px; font-size:13px}
.btn.ghost{background:transparent; border-color:transparent; color:var(--muted)}
.btn.ghost:hover{background:var(--surface2); color:var(--ink)}
.btn.xl{min-height:54px; font-size:16px; justify-content:center; width:100%; border-radius:12px}
.ibtn{width:38px; height:38px; display:inline-grid; place-items:center; border:1px solid var(--line); background:var(--surface); border-radius:var(--r-sm)}
.ibtn:hover{background:var(--surface2)}
svg.i{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; flex:none}

/* champs */
.field{display:flex; flex-direction:column; gap:6px; min-width:0}
.field label{font-size:12.5px; font-weight:700; color:var(--muted)}
.in{border:1px solid var(--line); background:var(--surface); border-radius:var(--r-sm); padding:9px 12px; min-height:40px; width:100%; min-width:0; transition:border-color .15s,box-shadow .15s}
.in:focus{border-color:var(--brand); outline:none; box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.in:disabled{opacity:.45; cursor:not-allowed; background:var(--surface2)}
.in.time{font-family:var(--f-mono); width:132px}
.err{color:var(--crit); font-size:13px; min-height:18px}

/* pastille poste */
.pill{--c:var(--p-mo); display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; padding:3px 10px; border-radius:99px; color:var(--c); background:color-mix(in srgb,var(--c) 13%,transparent); white-space:nowrap}
.pill::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--c)}
.pill.macon{--c:var(--p-macon)} .pill.coffreur{--c:var(--p-coffreur)} .pill.ferrailleur{--c:var(--p-ferrailleur)} .pill.mo{--c:var(--p-mo)}
.chip{display:inline-block; font-size:12px; font-weight:700; padding:3px 10px; border-radius:99px; background:var(--surface2); color:var(--muted); white-space:nowrap}
.chip.ok{background:var(--ok-soft); color:var(--ok)}
.chip.ot{background:var(--amber-soft); color:var(--amber-ink)}

/* avatar */
.av{--c:var(--p-mo); width:44px; height:44px; border-radius:14px; flex:none; display:grid; place-items:center; font:700 16px var(--f-display); letter-spacing:.02em; color:#fff; background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 70%,#000 18%)); overflow:hidden}
.av.macon{--c:var(--p-macon)} .av.coffreur{--c:var(--p-coffreur)} .av.ferrailleur{--c:var(--p-ferrailleur)} .av.mo{--c:var(--p-mo)}
.av img{width:100%; height:100%; object-fit:cover; display:block}
.av.lg{width:84px; height:84px; font-size:30px; border-radius:22px}
.av.sm{width:36px; height:36px; font-size:13px; border-radius:11px}

/* connexion */
.login{min-height:100vh; display:grid; grid-template-columns:1.1fr 1fr; gap:0; max-width:1100px; margin:0 auto; align-items:center; padding-block:24px}
.login-brand{background:#1E1B4B; min-height:380px; color:var(--hero-ink); border-radius:18px 0 0 18px; padding:26px; display:flex; flex-direction:column; gap:16px; min-width:0; box-shadow:var(--shadow-lg)}
.login-brand h1{font-size:clamp(24px,3.6vw,36px); line-height:1.05; text-transform:uppercase}
.login-brand p{margin:0; opacity:.85; max-width:36ch}
.logo{display:flex; align-items:center; gap:12px}
.logo svg{width:40px; height:40px; flex:none}
.logo img{height:72px; width:auto; max-width:340px; object-fit:contain; flex:none}
/* logo (fond blanc) sur pastille blanche arrondie quand le fond est sombre */
.login-brand .logo img{height:88px; max-width:360px; background:#fff; padding:12px 18px; border-radius:18px; box-shadow:0 10px 30px -10px rgba(0,0,0,.45)}
:root[data-theme="dark"] .logo img{background:#fff; padding:6px 10px; border-radius:12px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo img{background:#fff; padding:6px 10px; border-radius:12px}}
.logo b{font:700 15px var(--f-display); letter-spacing:.1em; text-transform:uppercase}
.login-brand .logo b{font-size:16px; color:#fff; text-shadow:0 1px 8px rgba(0,0,0,.45)}
.bareme{border-top:1px solid rgba(255,255,255,.2); padding-top:12px}
.bareme table{width:100%; border-collapse:collapse; font-size:13.5px}
.bareme td,.bareme th{padding:5px 0; text-align:left; font-weight:600; border-bottom:1px solid rgba(255,255,255,.12)}
.bareme th{font-size:11px; letter-spacing:.1em; text-transform:uppercase; opacity:.7}
.bareme td:not(:first-child),.bareme th:not(:first-child){text-align:right; font-family:var(--f-mono); font-size:13px}
.bareme .ot{color:#FDE68A}
.login-card{background:var(--surface); border:1px solid var(--line); border-left:0; border-radius:0 18px 18px 0; padding:32px; display:flex; flex-direction:column; gap:18px; justify-content:center; min-width:0; box-shadow:var(--shadow)}
.login-card h2{font-size:28px}
.seg{display:grid; grid-template-columns:1fr 1fr; background:var(--surface2); border-radius:12px; padding:4px; gap:4px}
.seg.one{grid-template-columns:1fr}
.seg.one button{cursor:default}
.seg button{border:0; background:transparent; padding:9px; border-radius:9px; font-weight:700; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
.hint{font-size:13px; color:var(--muted); font-weight:500}

/* coque admin */
.shell{display:grid; grid-template-columns:236px minmax(0,1fr); gap:22px; max-width:1380px; margin:0 auto; padding-block:16px}
.side{position:sticky; top:16px; align-self:start; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px 12px; display:flex; flex-direction:column; gap:18px; height:calc(100vh - 32px); max-height:660px; box-shadow:var(--shadow)}
.side .logo{padding:0 6px; color:var(--ink); flex-direction:column; align-items:flex-start; gap:10px}
.side .logo img{height:60px; max-width:100%}
.side .logo b{font-size:13px; line-height:1.15; letter-spacing:.06em}
.nav{display:flex; flex-direction:column; gap:3px}
.nav button{display:flex; align-items:center; gap:10px; border:0; background:transparent; padding:10px 12px; border-radius:11px; font-weight:700; font-size:14px; color:var(--muted); text-align:left; transition:background .15s,color .15s}
.nav button:hover{background:var(--surface2); color:var(--ink)}
.nav button[aria-current="page"]{background:var(--brand-soft); color:var(--brand)}
.side-foot{margin-top:auto; font-size:12px; color:var(--muted); padding:0 8px}
.main{min-width:0; display:flex; flex-direction:column; gap:18px; padding-bottom:24px}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.topbar h1{font-size:32px; line-height:1.05}
.topbar .acts{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.topbar .sub{margin:4px 0 0; color:var(--muted); font-weight:600}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px; min-width:0; box-shadow:var(--shadow)}
#printOnly{display:none}
.panel h2{font-size:24px; margin-bottom:12px; color:var(--ink)}
.panel-head{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:10px}
.panel-head h2{margin:0}
.grid2{display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:18px}
.grid2.b{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr)}
.kpis{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden}
.kpi{padding:16px 18px; display:flex; flex-direction:column; gap:4px; min-width:0}
.kpi + .kpi{border-left:1px solid var(--line)}
.kpi strong{font:700 32px/1 var(--f-display); letter-spacing:-.02em; font-variant-numeric:tabular-nums; display:flex; flex-wrap:wrap; align-items:baseline; column-gap:5px}
.kpi strong small{font-size:14px; font-weight:700; color:var(--muted)}
.kpi span:last-child{font-size:12.5px; color:var(--muted); font-weight:600}
.kpi.hot strong{color:var(--amber-ink)}
:root[data-theme="dark"] .kpi.hot strong{color:var(--amber)}
.banner{display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; background:var(--amber-soft); color:var(--amber-ink); border-radius:12px; padding:10px 14px; font-size:14px; font-weight:600}

/* tableaux */
.tw{overflow-x:auto}
table.t{width:100%; border-collapse:collapse; font-size:15px}
table.t th{font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink); text-align:left; padding:10px; border-bottom:2px solid var(--line); white-space:nowrap; font-weight:800}
table.t td{padding:11px 10px; border-bottom:1px solid var(--line); vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t .r{text-align:right}
table.t tfoot td{border-top:2px solid var(--ink); font-weight:800; border-bottom:0}
.who{display:flex; align-items:center; gap:10px; min-width:170px}
.who b{display:block; font-weight:700}
.ot-txt{color:var(--amber-ink); font-weight:700}
:root[data-theme="dark"] .ot-txt{color:var(--amber)}

/* personnel : cartes */
.tools{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; display:flex; flex-direction:column; gap:14px; min-width:0; position:relative; overflow:hidden; transition:box-shadow .15s,border-color .15s,transform .15s; --c:var(--p-mo)}
.card::before{content:""; position:absolute; inset:0 0 auto 0; height:4px; background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 60%,#fff 25%))}
.card.macon{--c:var(--p-macon)} .card.coffreur{--c:var(--p-coffreur)} .card.ferrailleur{--c:var(--p-ferrailleur)} .card.mo{--c:var(--p-mo)}
.card:hover{box-shadow:var(--shadow); border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
.card-top{display:flex; gap:12px; align-items:center; min-width:0}
.card-top > div{min-width:0}
.card-top b{display:block; font-size:15.5px; overflow-wrap:anywhere}
.kv{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:13.5px; margin:0}
.kv dt{color:var(--muted); font-weight:600}
.kv dd{margin:0; text-align:right; font-weight:700}
.card-acts{display:flex; gap:8px; flex-wrap:wrap; margin-top:auto}
.empty{padding:34px 12px; text-align:center; color:var(--muted); font-weight:600}
.card.add{border:2px dashed var(--line); background:transparent; flex-direction:row; align-items:center; justify-content:center; gap:8px; min-height:150px; color:var(--muted); font-weight:700; font-size:15px}
.card.add::before{display:none}
.card.add:hover{border-color:var(--brand); color:var(--brand); box-shadow:none}

/* modal */
.scrim{position:fixed; inset:0; background:rgba(8,12,24,.55); backdrop-filter:blur(3px); display:grid; place-items:center; padding:16px; z-index:50; overflow-y:auto}
.modal{background:var(--surface); border-radius:20px; width:min(560px,100%); max-height:calc(100vh - 32px); overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:16px; box-shadow:var(--shadow-lg); border:1px solid var(--line)}
.modal.wide{width:min(820px,100%)}
.modal h2{font-size:26px}
.form2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.form2 .full{grid-column:1/-1}
.photo-row{display:flex; gap:14px; align-items:center; flex-wrap:wrap}
.foot{display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap}
.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(8px); background:var(--ink); color:var(--bg); padding:11px 18px; border-radius:99px; font-weight:700; font-size:14px; z-index:80; opacity:0; pointer-events:none; transition:opacity .2s,transform .2s; box-shadow:var(--shadow-lg); max-width:calc(100% - 32px)}
.toast.on{opacity:1; transform:translateX(-50%) translateY(0)}

/* graphique */
.legend{display:flex; gap:16px; font-size:13px; color:var(--muted); flex-wrap:wrap; font-weight:600}
.legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px}
svg.chart{width:100%; height:auto; display:block}
.ax{fill:var(--muted); font:11px var(--f-mono)}
.gl{stroke:var(--line); stroke-width:1}

/* vue personnel connectée */
.me{max-width:880px; margin:0 auto; padding-block:16px 32px; display:flex; flex-direction:column; gap:16px}
.me-head{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
.me-head .logo{color:var(--ink)}
.id-card{background:var(--hero-bg); color:var(--hero-ink); border-radius:20px; padding:24px; display:flex; gap:18px; align-items:center; flex-wrap:wrap; box-shadow:var(--shadow)}
.id-card h1{font-size:32px; line-height:1.05}
.id-card .mono{opacity:.85; font-size:13px}
.id-card .pill{background:rgba(255,255,255,.16); color:var(--hero-ink)}
.id-card .pill::before{background:#FDE68A}
.id-card .kv dt{color:inherit; opacity:.7}
.clock{display:grid; grid-template-columns:1fr 1fr; gap:18px}
.bigtime{font:600 60px/1 var(--f-display); font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.gain{font:700 38px/1 var(--f-display); font-variant-numeric:tabular-nums}
.stack{display:flex; flex-direction:column; gap:10px}
.stack .chip{align-self:flex-start}
.sim-out{font:700 30px/1.1 var(--f-display); font-variant-numeric:tabular-nums}
.rate-grid{display:grid; grid-template-columns:minmax(150px,1.3fr) 1fr 1fr; gap:10px 12px; align-items:center}
.rate-grid .name{align-self:end; padding-bottom:10px; font-weight:700}

/* nav mobile */
@media (max-width:900px){
  .login{grid-template-columns:1fr; padding-block:12px; align-items:start}
  .login-brand{border-radius:18px 18px 0 0; padding:20px; gap:12px; min-height:230px}
  .bareme{display:none}
  .login-card{border-left:1px solid var(--line); border-top:0; border-radius:0 0 18px 18px; padding:26px}
  .shell{grid-template-columns:minmax(0,1fr); gap:12px}
  .side{position:fixed; left:12px; right:12px; bottom:calc(10px + env(safe-area-inset-bottom,0px)); top:auto; height:auto; max-height:none; z-index:40; border-radius:18px; border-width:1px; padding:6px; flex-direction:row; box-shadow:var(--shadow-lg)}
  .side .logo,.side-foot{display:none}
  .nav{flex-direction:row; width:100%; justify-content:space-around}
  .nav button{flex-direction:column; gap:2px; font-size:10.5px; padding:7px 4px; flex:1; align-items:center; text-align:center}
  .main{padding-bottom:96px}
  .grid2,.grid2.b{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(3){border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--line)}
  .topbar h1{font-size:26px}
}
@media (max-width:720px){
  table.rt thead{display:none}
  table.rt,table.rt tbody,table.rt tfoot,table.rt tr,table.rt td{display:block; width:100%}
  table.rt tr{border:1px solid var(--line); border-radius:12px; padding:6px 12px; margin-bottom:10px; background:var(--surface)}
  table.rt tfoot tr{background:var(--surface2)}
  table.rt td{display:flex; justify-content:space-between; align-items:center; gap:12px; border:0; padding:6px 0; text-align:right}
  table.rt tfoot td{border:0}

<script>
(function(){
'use strict';

/* ---------- Constantes ---------- */
var POSTES={
  macon:{label:'Technicien maçon',short:'Maçon'},
  coffreur:{label:'Technicien coffreur',short:'Coffreur'},
  ferrailleur:{label:'Technicien ferrailleur',short:'Ferrailleur'},
  mo:{label:"Main-d'œuvre",short:"Main-d'œuvre"}
};
var PK=Object.keys(POSTES);
var KEY='les-personnel-v1';
var THEME_KEY='les-theme';
var JOURS=['dim','lun','mar','mer','jeu','ven','sam'];
var JOURS_L=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
var MOIS_L=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

function defaultSettings(){
  return {
    stdStart:'07:30', stdEnd:'17:30',
    rates:{macon:6000,coffreur:6000,ferrailleur:6000,mo:3500},
    ot:{macon:500,coffreur:500,ferrailleur:500,mo:350},
    otMode:'full', prorate:false, adminCode:'admin'
  };
}

/* ---------- Utilitaires ---------- */
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseISO(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function toMin(h){var p=String(h).split(':');return (+p[0])*60+(+p[1]||0)}
function hm(m){return pad(Math.floor(m/60))+':'+pad(m%60)}
function nowHM(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}
function money(n){return new Intl.NumberFormat('fr-FR').format(Math.round(n)).replace(/[  ]/g,' ')+' FCFA'}
function numfr(n){return new Intl.NumberFormat('fr-FR').format(Math.round(n)).replace(/[  ]/g,' ')}
function hrs(n){return (Math.round(n*100)/100).toString().replace('.',',')+' h'}
function longDate(s){var d=parseISO(s);return JOURS_L[d.getDay()]+' '+d.getDate()+' '+MOIS_L[d.getMonth()]+' '+d.getFullYear()}
function monthLabel(m){var p=m.split('-');return MOIS_L[+p[1]-1]+' '+p[0]}
function initials(e){return ((e.prenom||'?').charAt(0)+(e.nom||'').charAt(0)).toUpperCase()}
function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

var ICONS={
  grid:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.4c1.9.8 3 2.6 3 5.6"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
  wallet:'<path d="M3 7h15a3 3 0 0 1 3 3v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 7V6a2 2 0 0 1 2-2h11"/><circle cx="16.5" cy="14" r="1.2"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  dl:'<path d="M12 3v11M7.5 10.5L12 15l4.5-4.5"/><path d="M4 20h16"/>',
  print:'<path d="M7 8V3.5h10V8"/><path d="M6 17H4.5A1.5 1.5 0 0 1 3 15.5v-5A1.5 1.5 0 0 1 4.5 9h15a1.5 1.5 0 0 1 1.5 1.5v5A1.5 1.5 0 0 1 19.5 17H18"/><rect x="7" y="14" width="10" height="7" rx="1"/>',
  out:'<path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="M16 8l4 4-4 4M20 12H9"/>',
  theme:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  cam:'<path d="M4 8h3l1.6-2.4h6.8L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/>',
  copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',
  play:'<path d="M7 4.5v15l12-7.5z"/>',
  stop:'<rect x="6" y="6" width="12" height="12" rx="1.5"/>'
};
function ico(n){return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+ICONS[n]+'</svg>'}
var LOGO='<img class="logo-img" src="Logo%20d%E2%80%99ing%C3%A9nierie%20et%20construction%20en%20bleu%20et%20jaune.png" alt="Leader Engineering Services — Construction Générale">';
var CHANTIER=['assets/chantier-btp.jpg','assets/chantier-2.jpg','assets/chantier-3.jpg']; /* uniquement des bâtiments en construction */
function sliderHTML(cls){return '<div class="slider '+(cls||'')+'" aria-hidden="true">'+CHANTIER.map(function(src,i){return '<img class="slide'+(i===0?' on':'')+'" src="'+src+'" alt="" loading="lazy">'}).join('')+'</div>'}

/* ---------- Données ---------- */
function seed(){
  var base=[['Jean-Paul','Mbarga','macon'],['Patrick','Nkeng','coffreur'],['Armand','Tchoua','ferrailleur'],['Serge','Ndongo','mo'],
            ['Landry','Fotso','macon'],['Claude','Biyong','ferrailleur'],['Rodrigue','Essomba','coffreur'],['Thierry','Abena','mo'],
            ['Alain','Kamga','macon'],['Nadège','Mvogo','mo']];
  var emps=base.map(function(e,i){return {id:'e'+(i+1),prenom:e[0],nom:e[1],ident:'LES-'+pad3(i+1),poste:e[2],debut:'07:30',fin:'17:30',photo:'',actif:true}});
  var att=[], s=7;
  function rnd(){s=(s*9301+49297)%233280;return s/233280}
  var extras=[0,0,0,30,45,60,90,120,150,180,210,240];
  var today=new Date();
  for(var k=1;k<=45;k++){
    var day=new Date(today.getFullYear(),today.getMonth(),today.getDate()-k);
    if(day.getDay()===0) continue;                                  // pas le dimanche
    emps.forEach(function(e){
      if(rnd()<0.08) return;                                        // ~8 % d'absences
      var st=450+Math.floor(rnd()*20);                             // arrivée ~07:30-07:50
      var en=1050+extras[Math.floor(rnd()*extras.length)];         // sortie 17:30 -> 21:30
      if(rnd()<0.06) en=720+Math.floor(rnd()*170);                  // ~6 % de journées courtes (12h-14h50)
      att.push({id:uid()+att.length,emp:e.id,date:iso(day),start:hm(st),end:hm(en)});
    });
  }
  return {emps:emps,att:att,settings:defaultSettings(),demo:true};
}
function pad3(n){return String(n).padStart(3,'0')}
function load(){
  try{var r=localStorage.getItem(KEY); if(r){var d=JSON.parse(r); if(d&&d.emps&&d.att&&d.settings) return d}}catch(e){}
  return null;
}
var DB=load()||seed();
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}

/* ---------- Calcul de la paie ---------- */
function calc(rec,emp,liveEnd){
  var S=DB.settings;
  if(!rec||!rec.start) return null;
  var endStr=rec.end||liveEnd;
  if(!endStr) return {open:true,base:0,otH:0,otPay:0,total:0,worked:0};
  var s=toMin(rec.start), e=toMin(endStr), a=toMin(S.stdStart), b=toMin(S.stdEnd);
  var rate=+S.rates[emp.poste]||0, ot=+S.ot[emp.poste]||0;
  var otMin=Math.max(0,e-b), otH;
  if(S.otMode==='started') otH=Math.ceil(otMin/60);
  else if(S.otMode==='prorata') otH=otMin/60;
  else otH=Math.floor(otMin/60);
  var base=rate;
  if(S.prorate){
    var inside=Math.max(0,Math.min(e,b)-Math.max(s,a));
    base=Math.round(rate*Math.min(1,inside/Math.max(1,b-a)));
  }
  var otPay=Math.round(otH*ot);
  return {open:!rec.end,base:base,otH:otH,otPay:otPay,total:base+otPay,worked:Math.max(0,e-s)/60};
}
function getRec(empId,date){return DB.att.find(function(r){return r.emp===empId&&r.date===date})}
function aggBy(empId,pred){
  var emp=DB.emps.find(function(e){return e.id===empId});
  var out={days:0,otH:0,base:0,ot:0,total:0,list:[]};
  if(!emp) return out;
  DB.att.filter(function(r){return r.emp===empId&&pred(r.date)&&r.end}).sort(function(a,b){return a.date<b.date?-1:1}).forEach(function(r){
    var c=calc(r,emp); if(!c) return;
    out.days++; out.otH+=c.otH; out.base+=c.base; out.ot+=c.otPay; out.total+=c.total; out.list.push({rec:r,c:c});
  });
  return out;
}
function monthAgg(empId,month){return aggBy(empId,function(d){return d.indexOf(month)===0})}
function dayAgg(date){
  var base=0,ot=0,n=0;
  DB.att.forEach(function(r){
    if(r.date!==date||!r.end) return;
    var emp=DB.emps.find(function(e){return e.id===r.emp}); if(!emp) return;
    var c=calc(r,emp); base+=c.base; ot+=c.otPay; n++;
  });
  return {base:base,ot:ot,n:n};
}

/* ---------- Vue base : tableau de pointage du personnel ---------- */
function departLocked(e,r){
  if(r&&r.end) return false;
  if(!r||!r.start) return true;
  return toMin(nowHM())<toMin(e.fin);
}
function baseRow(e){
  var r=getRec(e.id,todayISO), lock=departLocked(e,r), fin=e.fin.replace(':','h');

  if(lock){
    dep='<input class="in time" type="time" disabled aria-label="Heure de départ de '+esc(e.prenom)+'">'+
        '<span class="lock-hint">'+((!r||!r.start)?'Pointez d\'abord votre arrivée':'Départ à partir de '+esc(fin))+'</span>';
  }else{
    dep='<input class="in time" type="time" data-time="end" data-base="1" data-emp="'+e.id+'" value="'+(r&&r.end?esc(r.end):'')+'" aria-label="Heure de départ de '+esc(e.prenom)+'">';
  }
  return '<tr><td data-label=""><div class="who">'+avatar(e,'sm')+'<div><b>'+esc(e.prenom+' '+e.nom)+'</b><span class="mono muted">'+esc(e.ident)+'</span></div></div></td>'+
    '<td data-label="Poste">'+pillS(e.poste)+'</td>'+
    '<td data-label="Arrivée"><input class="in time" type="time" data-time="start" data-base="1" data-emp="'+e.id+'" value="'+(r?esc(r.start):'')+'" aria-label="Heure d\u2019arrivée de '+esc(e.prenom)+'"></td>'+
    '<td data-label="Départ">'+dep+'</td>'+
    '<td data-label="Statut">'+statusChip(e)+'</td></tr>';
}
function renderBase(){
  var act=DB.emps.filter(function(e){return e.actif});
  var fin=esc(DB.settings.stdEnd.replace(':','h'));
  var table=act.length?
    '<div class="tw"><table class="t rt base-table"><thead><tr><th>Profil</th><th>Poste</th><th>Arrivée</th><th>Départ</th><th>Statut</th></tr></thead><tbody>'+act.map(baseRow).join('')+'</tbody></table></div>':
    '<div class="empty">Aucun profil actif pour le moment.'+(DB.emps.length?'':' Générez des données d\'exemple ci-dessous, ou créez un profil depuis l\'administration.')+'</div>';
  return '<div class="base"><header class="base-head"><div class="logo">'+LOGO+'<b>Leader Engineering Services</b></div>'+
    '<div class="acts" style="display:flex;gap:10px;align-items:center"><span class="muted">'+esc(longDate(todayISO))+'</span>'+
    '<button class="ibtn" data-act="theme" title="Changer de thème" aria-label="Changer de thème">'+ico('theme')+'</button></div></header>'+
    '<section class="panel bp-lite"><div class="panel-head"><h2>Pointage du jour</h2>'+
    '<span class="muted base-hint">Entrez votre heure d\'arrivée ; la saisie du départ s\'ouvre à '+fin+'.</span></div>'+sliderHTML('banner')+table+'</section>'+
    '<footer class="base-foot">'+(act.length?'':'<button class="btn sm" data-act="demo-reseed">Générer des données d\'exemple</button>')+'<button class="btn sm ghost" data-act="to-login">Administration</button></footer></div>';
}

/* ---------- Tableau de bord admin ---------- */
function niceStep(max){
  var raw=max/4; if(raw<=0) return 1000;
  var mag=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10));
  var f=[1,2,2.5,5,10].find(function(m){return m*mag>=raw});
  return f*mag;
}
function chartSVG(){
  var n=window.innerWidth<600?7:14, sm=n===7, days=[],i,d;
  for(i=n-1;i>=0;i--){d=new Date();d.setDate(d.getDate()-i);days.push(iso(d))}
  var data=days.map(function(x){var a=dayAgg(x);return {d:x,base:a.base,ot:a.ot,n:a.n}});
  var mx=Math.max.apply(null,data.map(function(x){return x.base+x.ot}).concat([1]));
  var step=niceStep(mx), top=step*4;
  var W=sm?360:640,H=sm?220:230,L=sm?42:52,R=8,T=10,B=28, pw=W-L-R, ph=H-T-B, bw=pw/n;
  var g='',bars='',labels='';
  for(i=0;i<=4;i++){
    var y=T+ph-ph*i/4, v=step*i;
    g+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+(v>=1000?numfr(v/1000)+'k':v)+'</text>';
  }
  data.forEach(function(x,k){
    var cx=L+bw*k+bw/2, w=bw*0.56;
    var hb=ph*x.base/top, ho=ph*x.ot/top;
    var dt=parseISO(x.d);
    var tip=longDate(x.d)+' : '+(x.n?money(x.base+x.ot)+' ('+x.n+' pointés)':'aucun pointage');
    bars+='<g><title>'+esc(tip)+'</title>'+
      (hb>0?'<rect x="'+(cx-w/2)+'" y="'+(T+ph-hb)+'" width="'+w+'" height="'+hb+'" fill="var(--brand)"/>':'')+
      (ho>0?'<rect x="'+(cx-w/2)+'" y="'+(T+ph-hb-ho)+'" width="'+w+'" height="'+ho+'" fill="var(--amber)"/>':'')+'</g>';
    labels+='<text class="ax" x="'+cx+'" y="'+(H-8)+'" text-anchor="middle">'+(sm?JOURS[dt.getDay()]+' '+dt.getDate():JOURS[dt.getDay()].charAt(0)+dt.getDate())+'</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Coût journalier de la main-d\'œuvre">'+g+bars+labels+'</svg>';
}
function periodPred(){
  if(ui.period==='month'){var m=todayISO.slice(0,7);return function(d){return d.indexOf(m)===0}}
  var d0=new Date();d0.setDate(d0.getDate()-29);var f=iso(d0);
  return function(d){return d>=f&&d<=todayISO};
}
function renderDash(){
  var pred=periodPred(), plabel=ui.period==='month'?monthLabel(todayISO.slice(0,7)):'30 derniers jours';

  var present=act.filter(function(e){var r=getRec(e.id,todayISO);return r&&r.start}).length;
  var pct=act.length?Math.round(present/act.length*100):0;
  var tot=0,otH=0,otP=0,rank=[],perPoste={};
  PK.forEach(function(k){perPoste[k]={n:0,days:0,total:0}});
  DB.emps.forEach(function(e){
    var a=aggBy(e.id,pred);
    tot+=a.total;otH+=a.otH;otP+=a.ot;

    perPoste[e.poste].days+=a.days;perPoste[e.poste].total+=a.total;
    rank.push({e:e,a:a});

  rank=rank.filter(function(x){return x.a.otH>0}).sort(function(x,y){return y.a.otH-x.a.otH}).slice(0,6);

  }).join('')+'</ul>':'<div class="empty">Aucune heure supplémentaire sur cette période.</div>';

  }).join('');

  var totDays=0,totBase=0,totAll=0;

    return '<tr><td data-label=""><div class="who">'+avatar(x.e,'sm')+'<div><b>'+esc(x.e.prenom+' '+x.e.nom)+'</b><span class="mono muted">'+esc(x.e.ident)+'</span></div></div></td>'+
      '<td data-label="Poste">'+pillS(x.e.poste)+'</td>'+
      '<td data-label="Jours travaillés" class="r num"><b>'+x.a.days+'</b></td>'+
      '<td data-label="Montant à verser" class="r num"><b>'+numfr(x.a.base)+' FCFA</b></td>'+
      '<td data-label="Avec heures sup." class="r num">'+numfr(x.a.total)+' FCFA</td></tr>';
  }).join('');
  var statsInner='<div class="panel-head"><h2>Jours travaillés &amp; montant à verser par employé</h2><span class="muted">hors heures sup. · '+esc(plabel)+'</span></div>'+
    (stats.length?'<div class="tw"><table class="t rt"><thead><tr><th>Employé</th><th>Poste</th><th class="r">Jours travaillés</th><th class="r">Montant à verser (FCFA)</th><th class="r">Avec heures sup. (FCFA)</th></tr></thead><tbody>'+statsRows+'</tbody><tfoot><tr><td data-label="">Total — '+esc(plabel)+'</td><td data-label=""></td><td data-label="Jours" class="r num">'+totDays+'</td><td data-label="Base FCFA" class="r num">'+numfr(totBase)+' FCFA</td><td data-label="Total FCFA" class="r num"><b>'+numfr(totAll)+' FCFA</b></td></tr></tfoot></table></div>':'<div class="empty">Aucun profil actif. Créez le premier profil dans l\'onglet Personnel.</div>')+
    '<p class="muted" style="margin:10px 0 0;font-size:12.5px">« Montant à verser » = heures normales (salaire de base, hors heures sup.) ; « Avec heures sup. » = base + suppléments d\'heures supplémentaires.</p>';
  var statsPanel='<section class="panel">'+statsInner+'</section>';

  return topbar('Tableau de bord',etatsBtn+printBtn+seg,longDate(todayISO))+

      '<div class="kpi hot"><span class="lbl">Heures sup.</span><strong>'+hrs(otH).replace(' h','')+'<small>h</small></strong><span>'+money(otP)+' de suppléments</span></div>'+
      '<div class="kpi"><span class="lbl">Masse salariale</span><strong>'+numfr(tot)+'<small>FCFA</small></strong><span>'+esc(plabel)+'</span></div>'+
    '</section>'+
    '<div class="grid2"><section class="panel"><div class="panel-head"><h2>Coût journalier</h2><div class="legend"><span><i style="background:var(--brand)"></i>Base</span><span><i style="background:var(--amber)"></i>Heures sup.</span><span>en milliers de FCFA</span></div></div>'+chartSVG()+'</section>'+

function filteredEmps(){
  var q=ui.q.trim().toLowerCase();
  return DB.emps.filter(function(e){
    if(ui.fposte&&e.poste!==ui.fposte) return false;
    if(!q) return true;
    return (e.prenom+' '+e.nom+' '+e.ident).toLowerCase().indexOf(q)>-1;
  });
}

function etatsCSV(month){
  var lines=['Employé;Identifiant;Poste;Jours;Heures totales;Heures sup.;Salaire normal (FCFA);Salaire avec heures sup. (FCFA)'];
  var T={days:0,h:0,otH:0,base:0,total:0};
  DB.emps.forEach(function(e){
    var a=monthAgg(e.id,month); if(!a.days) return;
    var h=0; a.list.forEach(function(x){h+=x.c.worked});
    T.days+=a.days;T.h+=h;T.otH+=a.otH;T.base+=a.base;T.total+=a.total;
    lines.push([e.prenom+' '+e.nom,e.ident,POSTES[e.poste].label,a.days,(Math.round(h*100)/100),a.otH,a.base,a.total].join(';'));
  });
  lines.push(['Total','','',T.days,(Math.round(T.h*100)/100),T.otH,T.base,T.total].join(';'));
  return '\uFEFF'+lines.join('\r\n');
}

function dayBar(startHM,endHM){
  var S=DB.settings,a=toMin(S.stdStart),b=toMin(S.stdEnd);
  var lo=Math.floor((a-60)/60)*60, hi=Math.ceil((b+240)/60)*60, span=hi-lo;
  function p(m){return Math.max(0,Math.min(100,(m-lo)/span*100))}
  var s=toMin(startHM), e=Math.max(s,toMin(endHM));
  var w1=p(Math.min(e,b))-p(Math.min(s,b)), w2=e>b?p(e)-p(Math.max(s,b)):0;
  return '<div class="day"><div class="day-track"><span class="band std" style="left:'+p(a)+'%;width:'+(p(b)-p(a))+'%"></span><span class="band ot" style="left:'+p(b)+'%;width:'+(100-p(b))+'%"></span>'+
    (w1>0?'<span class="work" style="left:'+p(Math.min(s,b))+'%;width:'+w1+'%"></span>':'')+
    (w2>0?'<span class="work ot" style="left:'+p(Math.max(s,b))+'%;width:'+w2+'%"></span>':'')+
    '</div><div class="day-ticks"><span style="left:'+p(a)+'%">'+esc(S.stdStart)+'</span><span style="left:'+p(b)+'%">'+esc(S.stdEnd)+'</span></div>'+
    '<div class="legend"><span><i style="background:var(--brand)"></i>Journée standard</span><span><i style="background:var(--amber)"></i>Heures supplémentaires</span></div></div>';
}

function applyTheme(t){
  var r=document.documentElement;
  if(t) r.setAttribute('data-theme',t); else r.removeAttribute('data-theme');
}
function toggleTheme(){
  var cur=document.documentElement.getAttribute('data-theme');
  if(!cur) cur=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
  var nx=cur==='dark'?'light':'dark'; applyTheme(nx);
  try{localStorage.setItem(THEME_KEY,nx)}catch(e){}
}
try{var th=localStorage.getItem(THEME_KEY); if(th) applyTheme(th)}catch(e){}

function upsertTime(empId,field,val,date){
  var d=date||ui.date;
  var r=getRec(empId,d);
  if(!r){ if(!val) return; r={id:uid(),emp:empId,date:d,start:'',end:''}; DB.att.push(r) }
  r[field]=val;
  if(!r.start&&!r.end) DB.att=DB.att.filter(function(x){return x!==r});
  else if(!r.start&&r.end){r.start=DB.settings.stdStart}
  save();
}
function readPhoto(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        var s=200,c=document.createElement('canvas');c.width=c.height=s;
        var m=Math.min(img.width,img.height);
        c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);
        res(c.toDataURL('image/jpeg',0.82));
      };
      img.onerror=rej; img.src=fr.result;
    };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}

      setTimeout(function(){URL.revokeObjectURL(dlUrl)},1000); toast('Téléchargement lancé'); break;
    case 'print-dash': if(window.print) window.print(); break;
    case 'print-etats':
      document.body.classList.add('printing-modal');
      try{ if(window.print) window.print(); } finally { setTimeout(function(){document.body.classList.remove('printing-modal')},400) }
      break;
    case 'theme': toggleTheme(); break;
    case 'period': ui.period=v; render(); break;
    case 'nav': ui.tab=v; ui.confirmDel=null; render(); window.scrollTo(0,0); break;
    case 'emp-new': ui.modal={type:'emp',draft:{id:'',prenom:'',nom:'',ident:nextIdent(),poste:'macon',debut:DB.settings.stdStart,fin:DB.settings.stdEnd,photo:'',actif:true}}; renderModal(); break;
    case 'emp-edit': var e=DB.emps.find(function(x){return x.id===id}); if(e){ui.modal={type:'emp',draft:Object.assign({},e)};renderModal()} break;
    case 'emp-del': ui.confirmDel=id; $('#staffGrid').innerHTML=staffGridHTML(); break;

    case 'emp-del-yes': DB.emps=DB.emps.filter(function(x){return x.id!==id}); DB.att=DB.att.filter(function(x){return x.emp!==id}); ui.confirmDel=null; save(); render(); toast('Profil supprimé'); break;
    case 'photo-remove': readDraft(); ui.modal.draft.photo=''; $('#photoPrev').innerHTML=avatar(ui.modal.draft,'lg'); break;
    case 'modal-close': ui.modal=null; renderModal(); break;
    case 'emp-save':
      readDraft(); var d=ui.modal.draft, er=$('#formErr');
      if(!d.prenom||!d.nom){er.textContent='Le nom et le prénom sont obligatoires.';break}

      if(DB.emps.some(function(x){return x.id!==d.id&&x.ident.toUpperCase()===d.ident})){er.textContent='Cet identifiant est déjà utilisé par un autre profil.';break}
      if(!d.debut||!d.fin||toMin(d.fin)<=toMin(d.debut)){er.textContent='L\'heure de sortie doit être après la prise de service.';break}
      if(d.id){var i=DB.emps.findIndex(function(x){return x.id===d.id}); DB.emps[i]=d}
      else{d.id=uid(); DB.emps.push(d)}
      save(); ui.modal=null; render(); toast('Profil enregistré'); break;
    case 'time-prev': case 'time-next':
      var dt=parseISO(ui.date); dt.setDate(dt.getDate()+(act==='time-next'?1:-1)); ui.date=iso(dt); render(); break;
    case 'time-today': ui.date=todayISO; render(); break;
    case 'time-fill': var em=DB.emps.find(function(x){return x.id===id}); upsertTime(id,'start',em.debut); upsertTime(id,'end',em.fin); render(); break;
    case 'time-fillall':
      DB.emps.filter(function(x){return x.actif}).forEach(function(x){ if(!getRec(x.id,ui.date)){upsertTime(x.id,'start',x.debut);upsertTime(x.id,'end',x.fin)} });
      render(); toast('Pointages ajoutés'); break;
    case 'pay-detail': ui.modal={type:'detail',id:id}; renderModal(); break;
    case 'pay-copy':
      var txt=recapText();
      (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){toast('Récapitulatif copié')},function(){toast('Copie impossible dans ce navigateur')});
      break;
    case 'set-save':
      var S=DB.settings;
      if(!$('#sStart').value||!$('#sEnd').value||toMin($('#sEnd').value)<=toMin($('#sStart').value)){toast('La fin de journée doit être après le début');break}
      S.stdStart=$('#sStart').value; S.stdEnd=$('#sEnd').value;
      PK.forEach(function(k){S.rates[k]=Math.max(0,+$('#rate_'+k).value||0); S.ot[k]=Math.max(0,+$('#ot_'+k).value||0)});
      S.otMode=$('#sMode').value; S.prorate=$('#sProrate').checked;
      S.adminCode=$('#sCode').value.trim()||'admin';
      save(); toast('Paramètres enregistrés'); $('#simOut').innerHTML=simHTML(); break;
    case 'demo-clear':
      DB.emps=[];DB.att=[];DB.demo=false;save();render();toast('Exemples supprimés');break;
    case 'demo-reseed':
      DB=seed();save();render();toast('Données d\'exemple régénérées');break;
    case 'clock-in':
      if(!getRec(ui.empId,todayISO)){DB.att.push({id:uid(),emp:ui.empId,date:todayISO,start:nowHM(),end:''});save()}
      render(); toast('Service pris à '+nowHM()); break;
    case 'clock-out':
      var rr=getRec(ui.empId,todayISO);
      if(rr&&!rr.end){rr.end=nowHM(); if(toMin(rr.end)<toMin(rr.start)) rr.end=rr.start; save()}
      render(); toast('Fin de service enregistrée'); break;
  }
});

document.addEventListener('submit',function(ev){
  if(ev.target.id!=='loginForm') return;
  ev.preventDefault();
  if($('#lgCode').value===DB.settings.adminCode){ui.role='admin';ui.view='app';ui.tab='dash';ui.err='';render()}
  else{ui.err='Code incorrect.';$('#lgErr').textContent=ui.err}
});

document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='q'){ui.q=t.value;$('#staffGrid').innerHTML=staffGridHTML()}
  else if(t.id==='simPoste'||t.id==='simEnd'){$('#simOut').innerHTML=simHTML()}
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='fposte'){ui.fposte=t.value;$('#staffGrid').innerHTML=staffGridHTML()}
  else if(t.id==='timeDate'){if(t.value){ui.date=t.value;render()}}
  else if(t.id==='payMonth'){if(t.value){ui.month=t.value;render()}}
  else if(t.getAttribute&&t.getAttribute('data-time')){
    var emp=DB.emps.find(function(x){return x.id===t.getAttribute('data-emp')});
    var f=t.getAttribute('data-time'), d0=t.getAttribute('data-base')?todayISO:ui.date, r0=getRec(emp.id,d0);
    var other=r0?(f==='start'?r0.end:r0.start):'';
    if(t.value&&other&&f==='end'&&toMin(t.value)<toMin(other)){toast('La sortie doit être après la prise de service');render();return}
    upsertTime(emp.id,f,t.value,d0);
    if(t.getAttribute('data-base')) toast(f==='start'?'Arrivée enregistrée':'Départ enregistré');
    render();
  }
  else if(t.id==='etatsMonth'){if(t.value){ui.etatsMonth=t.value;renderModal()}}
  else if(t.id==='photoFile'&&t.files&&t.files[0]){
    readDraft();
    readPhoto(t.files[0]).then(function(url){ui.modal.draft.photo=url;$('#photoPrev').innerHTML=avatar(ui.modal.draft,'lg')},function(){$('#formErr').textContent='Cette image ne peut pas être lue.'});
  }
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&ui.modal){ui.modal=null;renderModal()}});

var wasNarrow=window.innerWidth<600;
window.addEventListener('resize',function(){var n=window.innerWidth<600; if(n!==wasNarrow){wasNarrow=n; if(ui.role==='admin'&&ui.tab==='dash') render()}});

/* défilement auto des sliders d'images (toutes les 4 s) */
setInterval(function(){
  var sliders=document.querySelectorAll('.slider');
  for(var k=0;k<sliders.length;k++){
    var s=sliders[k].querySelectorAll('.slide'), cur=sliders[k].querySelector('.slide.on');
    if(s.length<2) continue;
    var i=cur?Array.prototype.indexOf.call(s,cur):-1;
    if(cur) cur.classList.remove('on');
    s[(i+1)%s.length].classList.add('on');
  }
},4000);
render();
setInterval(liveTick,1000);
})();
</script>
