<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Leader Engineering Services</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Plan : tableau de bord de chantier. Barre latérale + zone de travail ; gris béton, bleu acier, ambre signalétique réservé aux heures supplémentaires. */
:root{
  --bg:#E6E9EC; --surface:#FFFFFF; --surface2:#F2F4F6; --ink:#18212B; --muted:#586674; --line:#D1D7DD;
  --brand:#1D4E80; --brand-ink:#FFFFFF; --hero-bg:#143A5F; --hero-ink:#F2F6FA;
  --amber:#E39B00; --amber-soft:#FFF1CC; --amber-ink:#7A5200;
  --ok:#1B8A57; --ok-soft:#DDF3E8; --crit:#B83227; --crit-soft:#FBE3E0;
  --p-macon:#2F6DB5; --p-coffreur:#17857D; --p-ferrailleur:#9A5B24; --p-mo:#62707E;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 8px 24px rgba(20,30,40,.05);
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F151B; --surface:#18212A; --surface2:#1F2A35; --ink:#E6ECF1; --muted:#93A2B1; --line:#2B3744;
    --brand:#6AA6E0; --brand-ink:#0C1620; --hero-bg:#0E2238; --hero-ink:#EAF1F7;
    --amber:#F2B632; --amber-soft:#3A2F10; --amber-ink:#F2C766;
    --ok:#4CC38A; --ok-soft:#14352A; --crit:#EF7B6F; --crit-soft:#3B1B18;
    --p-macon:#6AA6E0; --p-coffreur:#4CC3B9; --p-ferrailleur:#D49A5F; --p-mo:#9FB0C0;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F151B; --surface:#18212A; --surface2:#1F2A35; --ink:#E6ECF1; --muted:#93A2B1; --line:#2B3744;
  --brand:#6AA6E0; --brand-ink:#0C1620; --hero-bg:#0E2238; --hero-ink:#EAF1F7;
  --amber:#F2B632; --amber-soft:#3A2F10; --amber-ink:#F2C766;
  --ok:#4CC38A; --ok-soft:#14352A; --crit:#EF7B6F; --crit-soft:#3B1B18;
  --p-macon:#6AA6E0; --p-coffreur:#4CC3B9; --p-ferrailleur:#D49A5F; --p-mo:#9FB0C0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 var(--f-body);
  padding-block:0; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
h1,h2,h3{font-family:var(--f-display); font-weight:700; margin:0; text-wrap:balance; letter-spacing:.01em}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand); outline-offset:2px}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.lbl{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600}

/* boutons */
.btn{display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--surface); border-radius:6px; padding:8px 14px; font-weight:600; min-height:38px}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--brand); color:var(--brand-ink); border-color:var(--brand)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.warn{background:var(--crit); border-color:var(--crit); color:#fff}
.btn.sm{padding:5px 10px; min-height:30px; font-size:13px}
.btn.ghost{background:transparent}
.ibtn{width:38px; height:38px; display:inline-grid; place-items:center; border:1px solid var(--line); background:var(--surface); border-radius:6px}
.ibtn:hover{background:var(--surface2)}
svg.i{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none}

/* champs */
.field{display:flex; flex-direction:column; gap:6px; min-width:0}
.field label{font-size:13px; font-weight:600; color:var(--muted)}
.in{border:1px solid var(--line); background:var(--surface); border-radius:6px; padding:9px 11px; min-height:40px; width:100%; min-width:0}
.in:focus{border-color:var(--brand); outline:none; box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}
.in.time{font-family:var(--f-mono); width:132px}
.err{color:var(--crit); font-size:13px; min-height:18px}

/* pastille poste */
.pill{--c:var(--p-mo); display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:2px 9px; border-radius:99px; color:var(--c); background:color-mix(in srgb,var(--c) 14%,transparent); white-space:nowrap}
.pill::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--c)}
.pill.macon{--c:var(--p-macon)} .pill.coffreur{--c:var(--p-coffreur)} .pill.ferrailleur{--c:var(--p-ferrailleur)} .pill.mo{--c:var(--p-mo)}
.chip{display:inline-block; font-size:12px; font-weight:600; padding:2px 9px; border-radius:4px; background:var(--surface2); color:var(--muted)}
.chip.ok{background:var(--ok-soft); color:var(--ok)}
.chip.ot{background:var(--amber-soft); color:var(--amber-ink)}

/* avatar */
.av{--c:var(--p-mo); width:44px; height:44px; border-radius:50%; flex:none; display:grid; place-items:center; font:700 17px var(--f-display); letter-spacing:.03em; color:#fff; background:var(--c); overflow:hidden}
.av.macon{--c:var(--p-macon)} .av.coffreur{--c:var(--p-coffreur)} .av.ferrailleur{--c:var(--p-ferrailleur)} .av.mo{--c:var(--p-mo)}
.av img{width:100%; height:100%; object-fit:cover; display:block}
.av.lg{width:84px; height:84px; font-size:30px}
.av.sm{width:34px; height:34px; font-size:14px}

/* coque admin */
.shell{display:grid; grid-template-columns:220px minmax(0,1fr); gap:20px; max-width:1360px; margin:0 auto; padding-block:16px}
.side{position:sticky; top:16px; align-self:start; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px 12px; display:flex; flex-direction:column; gap:18px; height:calc(100vh - 32px); max-height:640px}
.side .logo{padding:0 6px; color:var(--ink)}
.side .logo b{font-size:14px; line-height:1.1; letter-spacing:.08em}
.nav{display:flex; flex-direction:column; gap:2px}
.nav button{display:flex; align-items:center; gap:10px; border:0; background:transparent; padding:10px; border-radius:6px; font-weight:600; color:var(--muted); text-align:left}
.nav button:hover{background:var(--surface2); color:var(--ink)}
.nav button[aria-current="page"]{background:color-mix(in srgb,var(--brand) 13%,transparent); color:var(--brand)}
.side-foot{margin-top:auto; font-size:12px; color:var(--muted); padding:0 6px}
.main{min-width:0; display:flex; flex-direction:column; gap:18px; padding-bottom:24px}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.topbar h1{font-size:34px; line-height:1}
.topbar .acts{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:18px; min-width:0}
.panel h2{font-size:22px; margin-bottom:12px}
.panel-head{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:10px}
.panel-head h2{margin:0}
.grid2{display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:18px}
.kpis{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); background:var(--surface); border:1px solid var(--line); border-radius:10px}
.kpi{padding:16px 18px; display:flex; flex-direction:column; gap:4px; min-width:0}
.kpi + .kpi{border-left:1px solid var(--line)}
.kpi strong{font:700 34px/1 var(--f-display); letter-spacing:.01em; font-variant-numeric:tabular-nums; display:flex; flex-wrap:wrap; align-items:baseline; column-gap:5px}
.kpi strong small{font-size:15px; font-weight:600; color:var(--muted)}
.kpi span:last-child{font-size:13px; color:var(--muted)}
.banner{display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; background:var(--amber-soft); color:var(--amber-ink); border-radius:8px; padding:10px 14px; font-size:14px}

/* tableaux */
.tw{overflow-x:auto}
table.t{width:100%; border-collapse:collapse; font-size:14px}
table.t th{font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; font-weight:600}
table.t td{padding:10px; border-bottom:1px solid var(--line); vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t .r{text-align:right}
table.t tfoot td{border-top:2px solid var(--ink); font-weight:700; border-bottom:0}
.who{display:flex; align-items:center; gap:10px; min-width:170px}
.who b{display:block; font-weight:600}
.ot-txt{color:var(--amber-ink); font-weight:600}
:root[data-theme="dark"] .ot-txt{color:var(--amber)}

/* personnel : cartes */
.tools{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.tools .in{width:auto; min-width:0; flex:1 1 200px; max-width:320px}
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px; display:flex; flex-direction:column; gap:14px; min-width:0}
.card-top{display:flex; gap:12px; align-items:center; min-width:0}
.card-top > div{min-width:0}
.card-top b{display:block; font-size:16px; overflow-wrap:anywhere}
.kv{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:13.5px; margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0; text-align:right}
.card-acts{display:flex; gap:8px; flex-wrap:wrap; margin-top:auto}
.empty{padding:34px 12px; text-align:center; color:var(--muted)}

/* modal */
.scrim{position:fixed; inset:0; background:rgba(8,14,20,.55); display:grid; place-items:center; padding:16px; z-index:50; overflow-y:auto}
.modal{background:var(--surface); border-radius:12px; width:min(560px,100%); max-height:calc(100vh - 32px); overflow-y:auto; padding:22px; display:flex; flex-direction:column; gap:16px; box-shadow:var(--shadow)}
.modal.wide{width:min(760px,100%)}
.modal h2{font-size:26px}
.form2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.form2 .full{grid-column:1/-1}
.photo-row{display:flex; gap:14px; align-items:center; flex-wrap:wrap}
.foot{display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap}
.toast{position:fixed; left:50%; bottom:calc(88px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:8px; font-weight:600; z-index:80; opacity:0; pointer-events:none; transition:opacity .2s; max-width:calc(100% - 32px)}
.toast.on{opacity:1}

/* graphique */
.legend{display:flex; gap:16px; font-size:13px; color:var(--muted); flex-wrap:wrap}
.legend i{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:-1px}
svg.chart{width:100%; height:auto; display:block}
.ax{fill:var(--muted); font:11px var(--f-mono)}
.gl{stroke:var(--line); stroke-width:1}

.stack{display:flex; flex-direction:column; gap:10px}
/* nav mobile */
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr); gap:12px}
  .side{position:fixed; left:0; right:0; bottom:0; top:auto; height:auto; max-height:none; z-index:40; border-radius:12px 12px 0 0; border-width:1px 0 0; padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px)); flex-direction:row}
  .side .logo,.side-foot{display:none}
  .nav{flex-direction:row; width:100%; justify-content:space-around}
  .nav button{flex-direction:column; gap:2px; font-size:11.5px; padding:6px 4px; flex:1; align-items:center; text-align:center}
  .main{padding-bottom:84px}
  .grid2,.grid2.b{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(3){border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--line)}
  .topbar h1{font-size:28px}
}
@media (max-width:560px){
  .form2{grid-template-columns:1fr}
  .clock{grid-template-columns:1fr}
  .bigtime{font-size:52px}
  .rate-grid{grid-template-columns:1fr 1fr}
  .rate-grid .name{grid-column:1/-1; font-weight:600}
  .rate-grid .lbl.h{display:none}
}

/* ---- compléments ---- */
.topbar .sub{margin:4px 0 0; color:var(--muted)}
.topbar .sub::first-letter{text-transform:uppercase}
.seg.sm{grid-template-columns:auto auto}
.seg.sm button{padding:7px 12px; font-size:14px}
.kpi{position:relative}
.kpi.hot strong{color:var(--amber-ink)}
.bar{height:6px; border-radius:99px; background:var(--surface2); overflow:hidden; margin:2px 0}
.bar i{display:block; height:100%; background:var(--ok); border-radius:99px}
.grid2.b{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr)}
.rank{list-style:none; margin:0; padding:0}
.rk{display:grid; grid-template-columns:minmax(170px,1.3fr) 1fr auto; gap:12px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line)}
.rk:last-child{border-bottom:0}
.rk .who{min-width:0}
.rk .pill{margin-top:3px}
.rk-bar{height:10px; background:var(--surface2); border-radius:5px; overflow:hidden}
.rk-bar i{display:block; height:100%; background:var(--amber); border-radius:5px}
.rk-v{display:flex; flex-direction:column; align-items:flex-end; line-height:1.2}
.rk-v small{color:var(--muted); font-size:12px}
.card{position:relative; overflow:hidden; transition:box-shadow .15s,border-color .15s; --c:var(--p-mo)}
.card::before{content:""; position:absolute; inset:0 0 auto 0; height:4px; background:var(--c)}
.card.macon{--c:var(--p-macon)} .card.coffreur{--c:var(--p-coffreur)} .card.ferrailleur{--c:var(--p-ferrailleur)} .card.mo{--c:var(--p-mo)}
.card:hover{box-shadow:var(--shadow)}
.card.add{border:2px dashed var(--line); background:transparent; flex-direction:row; align-items:center; justify-content:center; gap:8px; min-height:150px; color:var(--muted); font-weight:600; font-size:15px}
.card.add::before{display:none}
.card.add:hover{border-color:var(--brand); color:var(--brand); box-shadow:none}
.day{display:flex; flex-direction:column; gap:6px}
.day-track{position:relative; height:20px; border-radius:10px; background:var(--surface2); overflow:hidden}
.band{position:absolute; top:0; bottom:0}
.band.std{background:color-mix(in srgb,var(--brand) 16%,transparent)}
.band.ot{background:var(--amber-soft)}
.work{position:absolute; top:4px; bottom:4px; background:var(--brand); border-radius:6px}
.work.ot{background:var(--amber)}
.day-ticks{position:relative; height:18px; font:12px var(--f-mono); color:var(--muted)}
.day-ticks span{position:absolute; transform:translateX(-50%); white-space:nowrap}
.stack .chip{align-self:flex-start}
table.rt td .who{text-align:left}
@media (max-width:720px){
  table.rt thead{display:none}
  table.rt,table.rt tbody,table.rt tfoot,table.rt tr,table.rt td{display:block; width:100%}
  table.rt tr{border:1px solid var(--line); border-radius:10px; padding:6px 12px; margin-bottom:10px; background:var(--surface)}
  table.rt tfoot tr{background:var(--surface2)}
  table.rt td{display:flex; justify-content:space-between; align-items:center; gap:12px; border:0; padding:6px 0; text-align:right}
  table.rt tfoot td{border:0}
  table.rt td::before{content:attr(data-label); color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.06em; text-align:left; flex:none}
  table.rt td[data-label=""]{justify-content:flex-start}
  table.rt td[data-label=""]::before{content:none}
  table.rt td.act{justify-content:flex-end}
  table.rt td.empty{justify-content:center}
  .rk{grid-template-columns:minmax(0,1fr) auto}
  .rk-bar{grid-column:1/-1; order:3}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(function(){
'use strict';

/* ---------- Constantes ---------- */
var POSTES={
  macon:{label:'Technicien maçon',short:'Maçon'},
  coffreur:{label:'Technicien coffreur',short:'Coffreur'},
  ferrailleur:{label:'Technicien ferrailleur',short:'Ferrailleur'},
  mo:{label:"Main-d'œuvre",short:"Main-d'œuvre"}
};
var PK=Object.keys(POSTES);
var KEY='les-personnel-v1';
var THEME_KEY='les-theme';
var JOURS=['dim','lun','mar','mer','jeu','ven','sam'];
var JOURS_L=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
var MOIS_L=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

function defaultSettings(){
  return {
    stdStart:'07:30', stdEnd:'17:30',
    rates:{macon:6000,coffreur:6000,ferrailleur:6000,mo:3500},
    ot:{macon:500,coffreur:500,ferrailleur:500,mo:350},
    otMode:'full', prorate:false
  };
}

/* ---------- Utilitaires ---------- */
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseISO(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function toMin(h){var p=String(h).split(':');return (+p[0])*60+(+p[1]||0)}
function hm(m){return pad(Math.floor(m/60))+':'+pad(m%60)}
function nowHM(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}
function money(n){return new Intl.NumberFormat('fr-FR').format(Math.round(n)).replace(/[  ]/g,' ')+' FCFA'}
function numfr(n){return new Intl.NumberFormat('fr-FR').format(Math.round(n)).replace(/[  ]/g,' ')}
function hrs(n){return (Math.round(n*100)/100).toString().replace('.',',')+' h'}
function longDate(s){var d=parseISO(s);return JOURS_L[d.getDay()]+' '+d.getDate()+' '+MOIS_L[d.getMonth()]+' '+d.getFullYear()}
function monthLabel(m){var p=m.split('-');return MOIS_L[+p[1]-1]+' '+p[0]}
function initials(e){return ((e.prenom||'?').charAt(0)+(e.nom||'').charAt(0)).toUpperCase()}
function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

var ICONS={
  grid:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.4c1.9.8 3 2.6 3 5.6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  theme:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  cam:'<path d="M4 8h3l1.6-2.4h6.8L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/>'

function seed(){
  var base=[['Jean-Paul','Mbarga','macon'],['Patrick','Nkeng','coffreur'],['Armand','Tchoua','ferrailleur'],['Serge','Ndongo','mo'],
            ['Landry','Fotso','macon'],['Claude','Biyong','ferrailleur'],['Rodrigue','Essomba','coffreur'],['Thierry','Abena','mo']];
  var emps=base.map(function(e,i){return {id:'e'+(i+1),prenom:e[0],nom:e[1],ident:'LES-'+pad3(i+1),poste:e[2],debut:'07:30',fin:'17:30',photo:'',actif:true}});
  var att=[], s=7;
  function rnd(){s=(s*9301+49297)%233280;return s/233280}
  var extras=[0,0,0,45,60,90,120,150,180];
  var today=new Date();
  for(var k=1;k<=24;k++){
    var day=new Date(today.getFullYear(),today.getMonth(),today.getDate()-k);
    if(day.getDay()===0) continue;
    emps.forEach(function(e){
      if(rnd()<0.1) return;
      var st=450+Math.floor(rnd()*20);
      var en=1050+extras[Math.floor(rnd()*extras.length)];
      att.push({id:uid()+att.length,emp:e.id,date:iso(day),start:hm(st),end:hm(en)});
    });
  }
  return {emps:emps,att:att,settings:defaultSettings(),demo:true};
}

/* ---------- Calcul de la paie ---------- */
function calc(rec,emp,liveEnd){
  var S=DB.settings;
  if(!rec||!rec.start) return null;
  var endStr=rec.end||liveEnd;
  if(!endStr) return {open:true,base:0,otH:0,otPay:0,total:0,worked:0};
  var s=toMin(rec.start), e=toMin(endStr), a=toMin(S.stdStart), b=toMin(S.stdEnd);
  var rate=+S.rates[emp.poste]||0, ot=+S.ot[emp.poste]||0;
  var otMin=Math.max(0,e-b), otH;
  if(S.otMode==='started') otH=Math.ceil(otMin/60);
  else if(S.otMode==='prorata') otH=otMin/60;
  else otH=Math.floor(otMin/60);
  var base=rate;
  if(S.prorate){
    var inside=Math.max(0,Math.min(e,b)-Math.max(s,a));
    base=Math.round(rate*Math.min(1,inside/Math.max(1,b-a)));
  }
  var otPay=Math.round(otH*ot);
  return {open:!rec.end,base:base,otH:otH,otPay:otPay,total:base+otPay,worked:Math.max(0,e-s)/60};
}
function getRec(empId,date){return DB.att.find(function(r){return r.emp===empId&&r.date===date})}
function aggBy(empId,pred){
  var emp=DB.emps.find(function(e){return e.id===empId});
  var out={days:0,otH:0,base:0,ot:0,total:0,list:[]};
  if(!emp) return out;
  DB.att.filter(function(r){return r.emp===empId&&pred(r.date)&&r.end}).sort(function(a,b){return a.date<b.date?-1:1}).forEach(function(r){
    var c=calc(r,emp); if(!c) return;
    out.days++; out.otH+=c.otH; out.base+=c.base; out.ot+=c.otPay; out.total+=c.total; out.list.push({rec:r,c:c});
  });
  return out;
}
function monthAgg(empId,month){return aggBy(empId,function(d){return d.indexOf(month)===0})}
function dayAgg(date){
  var base=0,ot=0,n=0;
  DB.att.forEach(function(r){
    if(r.date!==date||!r.end) return;
    var emp=DB.emps.find(function(e){return e.id===r.emp}); if(!emp) return;
    var c=calc(r,emp); base+=c.base; ot+=c.otPay; n++;
  });
  return {base:base,ot:ot,n:n};
}

function niceStep(max){
  var raw=max/4; if(raw<=0) return 1000;
  var mag=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10));
  var f=[1,2,2.5,5,10].find(function(m){return m*mag>=raw});
  return f*mag;
}
function chartSVG(){
  var n=window.innerWidth<600?7:14, sm=n===7, days=[],i,d;
  for(i=n-1;i>=0;i--){d=new Date();d.setDate(d.getDate()-i);days.push(iso(d))}
  var data=days.map(function(x){var a=dayAgg(x);return {d:x,base:a.base,ot:a.ot,n:a.n}});
  var mx=Math.max.apply(null,data.map(function(x){return x.base+x.ot}).concat([1]));
  var step=niceStep(mx), top=step*4;
  var W=sm?360:640,H=sm?220:230,L=sm?42:52,R=8,T=10,B=28, pw=W-L-R, ph=H-T-B, bw=pw/n;
  var g='',bars='',labels='';
  for(i=0;i<=4;i++){
    var y=T+ph-ph*i/4, v=step*i;
    g+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+(v>=1000?numfr(v/1000)+'k':v)+'</text>';
  }
  data.forEach(function(x,k){
    var cx=L+bw*k+bw/2, w=bw*0.56;
    var hb=ph*x.base/top, ho=ph*x.ot/top;
    var dt=parseISO(x.d);
    var tip=longDate(x.d)+' : '+(x.n?money(x.base+x.ot)+' ('+x.n+' pointés)':'aucun pointage');
    bars+='<g><title>'+esc(tip)+'</title>'+
      (hb>0?'<rect x="'+(cx-w/2)+'" y="'+(T+ph-hb)+'" width="'+w+'" height="'+hb+'" fill="var(--brand)"/>':'')+
      (ho>0?'<rect x="'+(cx-w/2)+'" y="'+(T+ph-hb-ho)+'" width="'+w+'" height="'+ho+'" fill="var(--amber)"/>':'')+'</g>';
    labels+='<text class="ax" x="'+cx+'" y="'+(H-8)+'" text-anchor="middle">'+(sm?JOURS[dt.getDay()]+' '+dt.getDate():JOURS[dt.getDay()].charAt(0)+dt.getDate())+'</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Coût journalier de la main-d\'œuvre">'+g+bars+labels+'</svg>';
}

try{var th=localStorage.getItem(THEME_KEY); if(th) applyTheme(th)}catch(e){}

function upsertTime(empId,field,val){
  var r=getRec(empId,todayISO);
  if(!r){ if(!val) return; r={id:uid(),emp:empId,date:todayISO,start:'',end:''}; DB.att.push(r) }
  r[field]=val;
  if(!r.start&&!r.end) DB.att=DB.att.filter(function(x){return x!==r});
  else if(!r.start&&r.end){r.start=DB.settings.stdStart}
  save();
}
function readPhoto(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        var s=200,c=document.createElement('canvas');c.width=c.height=s;
        var m=Math.min(img.width,img.height);
        c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);
        res(c.toDataURL('image/jpeg',0.82));
      };
      img.onerror=rej; img.src=fr.result;
    };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}
function readDraft(){
  var d=ui.modal.draft;
  d.prenom=$('#fPrenom').value.trim(); d.nom=$('#fNom').value.trim();
  d.ident=$('#fIdent').value.trim().toUpperCase().replace(/\s+/g,'-');
  d.poste=$('#fPoste').value; d.debut=$('#fDebut').value; d.fin=$('#fFin').value; d.actif=$('#fActif').checked;
}
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]'); if(!t) return;
  var act=t.getAttribute('data-act'), id=t.getAttribute('data-id'), v=t.getAttribute('data-v');
  if(act==='scrim'){ if(ev.target!==t) return; act='modal-close' }
  switch(act){
    case 'theme': toggleTheme(); break;
    case 'period': ui.period=v; render(); break;
    case 'nav': ui.tab=v; ui.confirmDel=null; render(); window.scrollTo(0,0); break;
    case 'emp-new': ui.modal={type:'emp',draft:{id:'',prenom:'',nom:'',ident:nextIdent(),poste:'macon',debut:DB.settings.stdStart,fin:DB.settings.stdEnd,photo:'',actif:true}}; renderModal(); break;
    case 'emp-edit': var e=DB.emps.find(function(x){return x.id===id}); if(e){ui.modal={type:'emp',draft:Object.assign({},e)};renderModal()} break;
    case 'emp-del': ui.confirmDel=id; $('#staffGrid').innerHTML=staffGridHTML(); break;
    case 'emp-del-no': ui.confirmDel=null; $('#staffGrid').innerHTML=staffGridHTML(); break;
    case 'emp-del-yes': DB.emps=DB.emps.filter(function(x){return x.id!==id}); DB.att=DB.att.filter(function(x){return x.emp!==id}); ui.confirmDel=null; save(); render(); toast('Profil supprimé'); break;
    case 'photo-remove': readDraft(); ui.modal.draft.photo=''; $('#photoPrev').innerHTML=avatar(ui.modal.draft,'lg'); break;
    case 'modal-close': ui.modal=null; renderModal(); break;
    case 'emp-save':
      readDraft(); var d=ui.modal.draft, er=$('#formErr');
      if(!d.prenom||!d.nom){er.textContent='Le nom et le prénom sont obligatoires.';break}
      if(!d.ident){er.textContent='L\'identifiant est obligatoire.';break}
      if(DB.emps.some(function(x){return x.id!==d.id&&x.ident.toUpperCase()===d.ident})){er.textContent='Cet identifiant est déjà utilisé par un autre profil.';break}
      if(!d.debut||!d.fin||toMin(d.fin)<=toMin(d.debut)){er.textContent='L\'heure de sortie doit être après la prise de service.';break}
      if(d.id){var i=DB.emps.findIndex(function(x){return x.id===d.id}); DB.emps[i]=d}
      else{d.id=uid(); DB.emps.push(d)}
      save(); ui.modal=null; render(); toast('Profil enregistré'); break;
    case 'time-fill': var em=DB.emps.find(function(x){return x.id===id}); upsertTime(id,'start',em.debut); upsertTime(id,'end',em.fin); render(); break;
    case 'time-fillall':
      DB.emps.filter(function(x){return x.actif}).forEach(function(x){ if(!getRec(x.id,todayISO)){upsertTime(x.id,'start',x.debut);upsertTime(x.id,'end',x.fin)} });
      render(); toast('Pointages ajoutés'); break;
    case 'pay-detail': ui.modal={type:'detail',id:id}; renderModal(); break;
    case 'demo-clear':
      DB.emps=[];DB.att=[];DB.demo=false;save();render();toast('Exemples supprimés');break;
  }
});

document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='q'){ui.q=t.value;$('#staffGrid').innerHTML=staffGridHTML()}
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='fposte'){ui.fposte=t.value;$('#staffGrid').innerHTML=staffGridHTML()}
  else if(t.getAttribute&&t.getAttribute('data-time')){
    var emp=DB.emps.find(function(x){return x.id===t.getAttribute('data-emp')});
    var f=t.getAttribute('data-time'), r0=getRec(emp.id,todayISO);
    var other=r0?(f==='start'?r0.end:r0.start):'';
    if(t.value&&other&&f==='end'&&toMin(t.value)<toMin(other)){toast('La sortie doit être après la prise de service');render();return}
    upsertTime(emp.id,f,t.value); render();
  }
  else if(t.id==='photoFile'&&t.files&&t.files[0]){
    readDraft();
    readPhoto(t.files[0]).then(function(url){ui.modal.draft.photo=url;$('#photoPrev').innerHTML=avatar(ui.modal.draft,'lg')},function(){$('#formErr').textContent='Cette image ne peut pas être lue.'});
  }
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&ui.modal){ui.modal=null;renderModal()}});

var wasNarrow=window.innerWidth<600;
window.addEventListener('resize',function(){var n=window.innerWidth<600; if(n!==wasNarrow){wasNarrow=n; if(ui.tab==='dash') render()}});
render();
})();
</script>

</body></html>
