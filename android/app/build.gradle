plugins {
    id "com.android.application"
}

android {
    namespace "com.yanntchinda.centrenotifications"
    compileSdk 34

    defaultConfig {
        applicationId "com.yanntchinda.centrenotifications"
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName "2.3.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
