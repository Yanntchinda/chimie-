name: Build EXE (Windows)

on:
  push:
    branches: [arena/957e1624-chimie, main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de release où publier le .exe (laisser vide = artifact seul)'
        required: false
        default: ''
  release:
    types: [published]

jobs:
  build-exe:
    runs-on: windows-latest
    permissions:
      contents: write   # nécessaire pour publier le .exe dans une Release
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installation des dépendances
        run: npm ci --no-audit --no-fund

      - name: Compilation du .exe (NSIS, x64)
        run: npx electron-builder --win --x64 --publish never

      - name: Upload de l'installeur .exe (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Leader-Engineering-Services-Setup-x64.exe
          path: dist/*.exe
          retention-days: 90

      - name: Publication du .exe dans la Release GitHub (fichier direct, pas de zip)
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then TAG="${{ inputs.release_tag }}"; else TAG="${{ github.ref_name }}"; fi
          echo "Publication dans la release $TAG"
          gh release upload "$TAG" dist/*.exe --clobber --repo "$GITHUB_REPOSITORY"
